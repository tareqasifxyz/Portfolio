<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lecturer of Electrical Engineering</title>
</head>


<body>

    <div data-name="Job_Stamford_Panel">

        <style>

            /* =========================================================
               Job_Stamford_Panel
               Self-contained component CSS
               ========================================================= */

            [data-name="Job_Stamford_Panel"] {
                width: 100%;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 40px;
                background: #f3f5f7;
                font-family: Arial, Helvetica, sans-serif;
                color: #17202a;
                box-sizing: border-box;
            }


                /* ---------- Main Card ---------- */

                [data-name="Job_Stamford_Panel"] .experience-card {
                    width: min(100%, 700px);
                    display: grid;
                    grid-template-columns: 90px 1fr;
                    background: #ffffff;
                    border: 1px solid #e1e5e8;
                    border-radius: 20px;
                    overflow: hidden;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
                    box-sizing: border-box;
                }


                /* ---------- Left Side ---------- */

                [data-name="Job_Stamford_Panel"] .card-side {
                    display: grid;
                    place-items: center;
                    background: #17202a;
                    color: #ffffff;
                    font-size: 17px;
                    font-weight: bold;
                    text-align: center;
                    line-height: 1.3;
                }


                /* ---------- Card Content ---------- */

                [data-name="Job_Stamford_Panel"] .card-content {
                    display: grid;
                    gap: 24px;
                    padding: 30px;
                    min-width: 0;
                    box-sizing: border-box;
                }


                /* ---------- Position Information ---------- */

                [data-name="Job_Stamford_Panel"] .position-section {
                    display: grid;
                    gap: 8px;
                }


                    [data-name="Job_Stamford_Panel"] .position-section h1 {
                        font-size: 25px;
                        line-height: 1.25;
                        font-weight: 700;
                    }


                [data-name="Job_Stamford_Panel"] .university {
                    font-size: 17px;
                    line-height: 1.5;
                    color: #5f6b76;
                }


                [data-name="Job_Stamford_Panel"] .location {
                    font-size: 14px;
                    color: #7a858f;
                }


                /* ---------- Divider ---------- */

                [data-name="Job_Stamford_Panel"] .divider {
                    width: 100%;
                    height: 1px;
                    background: #e8ebed;
                }


                /* ---------- Courses Section ---------- */

                [data-name="Job_Stamford_Panel"] .courses-section {
                    display: grid;
                    gap: 14px;
                }


                [data-name="Job_Stamford_Panel"] .courses-title {
                    font-size: 13px;
                    font-weight: 700;
                    text-transform: uppercase;
                    letter-spacing: 1px;
                    color: #7a858f;
                }


                /* ---------- Course Grid ---------- */

                [data-name="Job_Stamford_Panel"] .courses-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                    gap: 10px;
                }


                /* ---------- Individual Course ---------- */

                [data-name="Job_Stamford_Panel"] .course {
                    display: grid;
                    grid-template-columns: 8px 1fr;
                    align-items: center;
                    gap: 12px;
                    min-height: 58px;
                    padding: 12px 14px;
                    background: #f7f8f9;
                    border: 1px solid #e8ebed;
                    border-radius: 10px;
                    font-size: 14px;
                    line-height: 1.4;
                    transition: transform 0.2s ease, box-shadow 0.2s ease;
                    box-sizing: border-box;
                }


                    [data-name="Job_Stamford_Panel"] .course:hover {
                        transform: translateY(-2px);
                        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.07);
                    }


                /* ---------- Course Marker ---------- */

                [data-name="Job_Stamford_Panel"] .course-marker {
                    width: 8px;
                    height: 8px;
                    border-radius: 50%;
                    background: #17202a;
                }


            /* =========================================================
               Mobile
               ========================================================= */

            @media (max-width: 600px) {

                [data-name="Job_Stamford_Panel"] {
                    padding: 20px;
                }


                    [data-name="Job_Stamford_Panel"] .experience-card {
                        grid-template-columns: 1fr;
                    }


                    [data-name="Job_Stamford_Panel"] .card-side {
                        min-height: 70px;
                    }


                    [data-name="Job_Stamford_Panel"] .card-content {
                        padding: 24px;
                    }


                    [data-name="Job_Stamford_Panel"] .position-section h1 {
                        font-size: 22px;
                    }


                    [data-name="Job_Stamford_Panel"] .courses-grid {
                        grid-template-columns: 1fr;
                    }
            }
        </style>


        <!-- =========================================================
             Main Experience Card
             ========================================================= -->

        <main class="experience-card">


            <!-- Card Label -->

            <aside class="card-side">
                Lecturer
            </aside>


            <!-- Card Content -->

            <section class="card-content">


                <!-- Position Information -->

                <div class="position-section">

                    <h1>
                        Lecturer of Electrical Engineering
                    </h1>

                    <p class="university">
                        Stamford University Bangladesh
                    </p>

                    <p class="location">
                        📍 Dhaka, Bangladesh
                    </p>

                </div>


                <!-- Divider -->

                <div class="divider"></div>


                <!-- Courses -->

                <div class="courses-section">

                    <h2 class="courses-title">
                        Courses Taught
                    </h2>


                    <div class="courses-grid">


                        <div class="course">

                            <span class="course-marker"></span>

                            <span>
                                Microprocessor
                            </span>

                        </div>


                        <div class="course">

                            <span class="course-marker"></span>

                            <span>
                                Control Systems
                            </span>

                        </div>


                        <div class="course">

                            <span class="course-marker"></span>

                            <span>
                                MATLAB / Simulink
                            </span>

                        </div>


                        <div class="course">

                            <span class="course-marker"></span>

                            <span>
                                Assembly Language Programming
                            </span>

                        </div>


                    </div>

                </div>


            </section>

        </main>


    </div>

</body>

</html>
