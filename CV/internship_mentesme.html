```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Programming Intern</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 40px;
            background: #f3f5f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #17202a;
        }


        /* ---------- Main Card ---------- */

        .experience-card {
            width: min(100%, 680px);
            display: grid;
            grid-template-columns: 95px 1fr;
            background: #ffffff;
            border: 1px solid #e1e5e8;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }


        /* ---------- Left Label ---------- */

        .card-side {
            display: grid;
            place-items: center;
            padding: 20px;
            background: #17202a;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            line-height: 1.3;
        }


        /* ---------- Card Content ---------- */

        .card-content {
            display: grid;
            gap: 22px;
            padding: 30px;
        }


        /* ---------- Position ---------- */

        .position-section {
            display: grid;
            gap: 8px;
        }

            .position-section h1 {
                font-size: 25px;
                line-height: 1.25;
                font-weight: 700;
            }

        .company {
            font-size: 17px;
            line-height: 1.5;
            color: #5f6b76;
        }

        .location {
            font-size: 14px;
            color: #7a858f;
        }


        /* ---------- Divider ---------- */

        .divider {
            height: 1px;
            background: #e8ebed;
        }


        /* ---------- Section Titles ---------- */

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a858f;
        }


        /* ---------- Technology Section ---------- */

        .technology-section {
            display: grid;
            gap: 14px;
        }

        .technology-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .technology {
            display: grid;
            place-items: center;
            min-height: 48px;
            padding: 10px 14px;
            background: #f7f8f9;
            border: 1px solid #e1e5e8;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #34495e;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

            .technology:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.07);
            }


        /* ---------- Responsibilities ---------- */

        .responsibility-section {
            display: grid;
            gap: 12px;
        }

        .responsibility {
            display: grid;
            grid-template-columns: 8px 1fr;
            align-items: start;
            gap: 12px;
            padding: 15px;
            background: #f7f8f9;
            border: 1px solid #e8ebed;
            border-radius: 10px;
        }

        .responsibility-marker {
            width: 8px;
            height: 8px;
            margin-top: 6px;
            border-radius: 50%;
            background: #17202a;
        }

        .responsibility-text {
            font-size: 15px;
            line-height: 1.5;
            color: #34495e;
        }


        /* ---------- Mobile ---------- */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .experience-card {
                grid-template-columns: 1fr;
            }

            .card-side {
                min-height: 70px;
            }

            .card-content {
                padding: 24px;
            }

            .position-section h1 {
                font-size: 22px;
            }

            .technology-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 400px) {

            .technology-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

    <main class="experience-card">

        <!-- Card label -->
        <aside class="card-side">
            Intern
        </aside>


        <!-- Card content -->
        <section class="card-content">

            <!-- Position -->
            <div class="position-section">

                <h1>
                    Java Programming Intern
                </h1>

                <p class="company">
                    MentesMe
                </p>

                <p class="location">
                    📍 Eindhoven, Netherlands
                </p>

            </div>


            <div class="divider"></div>


            <!-- Technology -->
            <div class="technology-section">

                <h2 class="section-title">
                    Technology Used
                </h2>

                <div class="technology-grid">

                    <div class="technology">
                        Java
                    </div>

                    <div class="technology">
                        Hibernate
                    </div>

                    <div class="technology">
                        SQL
                    </div>

                    <div class="technology">
                        API Integrations
                    </div>

                    <div class="technology">
                        Learning Management Systems
                    </div>

                </div>

            </div>


            <div class="divider"></div>


            <!-- Responsibilities -->
            <div class="responsibility-section">

                <h2 class="section-title">
                    Responsibilities
                </h2>

                <div class="responsibility">

                    <span class="responsibility-marker"></span>

                    <p class="responsibility-text">
                        Prototyped API integrations with external Learning Management Systems.
                    </p>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
```
