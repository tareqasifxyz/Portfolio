```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CV Page</title>

    <style>
        /* ---------- Page ---------- */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 40px;
            background: #f3f5f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #17202a;
        }


        /* ---------- Main Container ---------- */

        .page {
            width: min(100%, 900px);
            margin: 0 auto;
            display: grid;
            gap: 24px;
        }


        /* ---------- Page Title ---------- */

        .page-title {
            padding: 30px;
            background: #ffffff;
            border: 1px solid #e1e5e8;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

            .page-title h1 {
                font-size: 32px;
                line-height: 1.25;
                font-weight: 700;
            }


        /* ---------- CV Section ---------- */

        .cv-section {
            padding: 30px;
            background: #ffffff;
            border: 1px solid #e1e5e8;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }


        /* ---------- CV Grid ---------- */

        .cv-grid {
            display: grid;
            /*
             * Cards automatically stay on the same row
             * while there is enough space.
             * When there is not enough space,
             * they move to the next row.
             */
            grid-template-columns: repeat( auto-fit, minmax(180px, 1fr) );
            gap: 14px;
        }


        /* ---------- CV Card ---------- */

        .cv-card {
            display: grid;
            place-items: center;
            min-height: 120px;
            padding: 20px;
            background: #f7f8f9;
            border: 1px solid #e8ebed;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

            .cv-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            }


        /* ---------- Mobile ---------- */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .page-title,
            .cv-section {
                padding: 24px;
            }

                .page-title h1 {
                    font-size: 26px;
                }

            .cv-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

    <main class="page">

        <!-- Page Title -->
        <header class="page-title">

            <h1>CV page</h1>

        </header>


        <!-- CV Cards -->
        <section class="cv-section">

            <div id="cv-grid"
                 class="cv-grid">
            </div>

        </section>

    </main>


    <script>

        /*
         * Dummy CV data.
         *
         * Later, this array can be replaced with
         * the actual CV data.
         */

        const cvData = [
            {
                title: "Degree 1"
            },
            {
                title: "Degree 2"
            },
            {
                title: "Experience 1"
            },
            {
                title: "Experience 2"
            }
        ];


        /*
         * Find the CV grid in the HTML.
         */

        const cvGrid =
            document.getElementById("cv-grid");


        /*
         * Populate the grid using the
         * dummy CV data.
         */

        cvData.forEach(item =>
        {

            const card =
                document.createElement("div");

            card.className = "cv-card";

            card.textContent = item.title;

            cvGrid.appendChild(card);

        });

    </script>

</body>
</html>
```
