```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dutch Language</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 40px;
            background: #f3f5f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #17202a;
        }


        /* ---------- Main Card ---------- */

        .language-card {
            width: min(100%, 620px);
            display: grid;
            grid-template-columns: 90px 1fr;
            background: #ffffff;
            border: 1px solid #e1e5e8;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }


        /* ---------- Left Label ---------- */

        .card-side {
            display: grid;
            place-items: center;
            background: #17202a;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
        }


        /* ---------- Card Content ---------- */

        .card-content {
            display: grid;
            gap: 20px;
            padding: 28px 30px;
        }


        /* ---------- Header ---------- */

        .language-header {
            display: grid;
            gap: 7px;
        }

        .language-name {
            font-size: 25px;
            font-weight: 700;
        }

        .language-label {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a858f;
        }


        /* ---------- Levels Grid ---------- */

        .levels-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }


        /* ---------- Level Card ---------- */

        .level {
            display: grid;
            gap: 8px;
            padding: 16px;
            background: #f7f8f9;
            border: 1px solid #e8ebed;
            border-radius: 10px;
        }

        .level-name {
            font-size: 20px;
            font-weight: 700;
            color: #17202a;
        }

        .level-status {
            font-size: 13px;
            line-height: 1.4;
            color: #5f6b76;
        }


        /* ---------- Institution ---------- */

        .institution {
            display: grid;
            gap: 5px;
            padding-top: 4px;
        }

        .institution-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #8a96a3;
        }

        .institution-name {
            font-size: 14px;
            font-weight: 600;
            color: #34495e;
        }


        /* ---------- Mobile ---------- */

        @media (max-width: 550px) {

            body {
                padding: 20px;
            }

            .language-card {
                grid-template-columns: 1fr;
            }

            .card-side {
                min-height: 70px;
            }

            .card-content {
                padding: 24px;
            }

            .levels-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>


<body>

    <main class="language-card">

        <!-- Card label -->
        <aside class="card-side">
            NL
        </aside>


        <!-- Card content -->
        <section class="card-content">

            <!-- Language -->
            <div class="language-header">

                <h1 class="language-name">
                    Dutch Language
                </h1>

                <p class="language-label">
                    Language Proficiency
                </p>

            </div>


            <!-- Levels -->
            <div class="levels-grid">

                <div class="level">

                    <span class="level-name">
                        A2
                    </span>

                    <p class="level-status">
                        Level completed
                    </p>

                </div>


                <div class="level">

                    <span class="level-name">
                        B1
                    </span>

                    <p class="level-status">
                        Currently ongoing
                    </p>

                </div>

            </div>


            <!-- Institution -->
            <div class="institution">

                <span class="institution-label">
                    Training Provider
                </span>

                <span class="institution-name">
                    Sagenn — Alphen aan den Rijn
                </span>

            </div>

        </section>

    </main>

</body>
</html>
```
